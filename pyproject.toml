[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "caes-storage"
version = "1.0.0"
description = "Low-temperature adiabatic CAES (LTA and LTAHP) efficiency and exergy simulator"
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "CoolProp>=6.4",
    "matplotlib>=3.7",
    "schemdraw>=0.19",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
caes-simulate = "caes.cli:main"

# The desktop application is a gui-script, not a console script: on Windows that
# launcher uses pythonw, so the Tk window opens without a dead console behind it.
# There is deliberately no second console-mode alias for the same entry point.
[project.gui-scripts]
caes-storage = "caes.gui:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["caes*"]
